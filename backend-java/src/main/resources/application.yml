# =====================================================
# PaperTrail Spring Boot Configuration
# =====================================================

spring:
  application:
    name: papertrail

  # --- Database ---
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paperdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:nimal}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- File Upload ---
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:20}MB
      max-request-size: 100MB
      enabled: true

# --- Server ---
server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# --- Springdoc / Swagger ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# --- Custom App Properties ---
papertrail:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
  storage:
    paper-dir: ${PAPER_STORAGE_DIR:./data/papers}
  upload:
    max-file-size-mb: ${MAX_FILE_SIZE_MB:20}
    max-files-per-request: ${MAX_FILES_PER_REQUEST:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    # Must be at least 32 characters. Set JWT_SECRET in your .env or environment.
    secret: ${JWT_SECRET:papertrail-dev-secret-key-change-in-production-min32chars}
    # Token expiry in milliseconds (default: 24 hours)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# --- Logging ---
logging:
  level:
    com.papertrail: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
