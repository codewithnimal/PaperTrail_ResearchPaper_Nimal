version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papertrail-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
